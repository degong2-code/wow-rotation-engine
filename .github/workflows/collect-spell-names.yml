name: Collect Blizzard ko_KR spell names (manual; evidence only)

on:
  push:
    branches: [work/once-ko-kr-evidence-20261110]
  workflow_dispatch:
    inputs:
      max_ids:
        description: "Spell IDs to query, max 176. API may return 404 for unsupported spells."
        required: true
        default: '176'

permissions:
  contents: read

jobs:
  collect-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install -r requirements-v2.txt
      - name: Validate input and presence of credentials
        shell: bash
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          MAX_IDS: ${{ github.event.inputs.max_ids || '176' }}
        run: |
          test -n "$BLIZZARD_CLIENT_ID" && test -n "$BLIZZARD_CLIENT_SECRET" || { echo "Missing Blizzard GitHub Secrets"; exit 1; }
          [[ "$MAX_IDS" =~ ^[0-9]+$ ]] && (( MAX_IDS >= 1 && MAX_IDS <= 176 )) || { echo "max_ids must be 1..176"; exit 1; }
      - name: Query official Korean spell data (no automatic approval)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          MAX_IDS: ${{ github.event.inputs.max_ids || '176' }}
        run: |
          python -m engine.spell_names fetch --max-ids "$MAX_IDS" \
            --output dist/spell-name-snapshot.json \
            --report dist/spell-name-audit.json
      - name: Summarize comparison (no credentials in output)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/spell-name-audit.json").read_text(encoding="utf-8"))
          snap=json.loads(Path("dist/spell-name-snapshot.json").read_text(encoding="utf-8"))
          c=d["counts"]
          print("SPELL_AUDIT_COUNTS="+json.dumps(c,ensure_ascii=False,sort_keys=True))
          print("SPELL_OBSERVATIONS="+str(len(snap["observations"])))
          print("SPELL_OBSERVATION_STATUSES="+json.dumps(
              {status:sum(r["status"]==status for r in snap["observations"])
               for status in sorted({r["status"] for r in snap["observations"]})},
              ensure_ascii=False,sort_keys=True))
          print("NAME_MISMATCHES="+json.dumps([
              {"spell_id":r["spell_id"],
               "inherited_names_ko":r["inherited_names_ko"],
               "observed_name_ko":r.get("observed_name_ko")}
              for r in d["records"] if r["comparison"]=="name_disagrees_with_inherited"
          ], ensure_ascii=False))
          PY
      - name: Upload comparison evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ko-kr-spell-name-evidence
          path: |
            dist/spell-name-snapshot.json
            dist/spell-name-audit.json
          retention-days: 7
