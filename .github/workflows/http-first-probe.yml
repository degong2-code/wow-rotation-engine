name: HTTP-first Wowhead access diagnostic (no bypass)

on:
  push:
    branches: ['work/chat-first-v11-20261111']
    paths:
      - 'engine/http_source_fetch.py'
      - 'engine/spec_source_resolver.py'
      - 'engine/guide_identity.py'
      - 'engine/source_acquisition_pipeline.py'
      - 'engine/gameplay_decision_qa.py'
      - 'engine/source_scoped_evidence.py'
      - 'tests/test_source_scoped_evidence.py'
      - 'tests/live_enhancement_decision_review.py'
      - '.github/workflows/http-first-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve specialization input to real current Wowhead guide
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from engine.source_acquisition_pipeline import run_specialization
          from engine.source_page_acquire import SourceAccessError
          from engine.spec_source_resolver import SpecializationResolutionError

          # No source HTML, page title or copyrighted guide text in CI output.
          # One ordinary HTTPS GET per specialization, no cookies or retries.
          for name, baseline in (
              ("고양 주술사", "6657591171c36c79797b739b2248e37b9d967094e7d33e8dd799293283bd5dbe"),
              ("생존 사냥꾼", None),
              ("비전 마법사", None),
          ):
              label={"고양 주술사":"enhancement","생존 사냥꾼":"survival",
                     "비전 마법사":"arcane"}[name]
              try:
                  with TemporaryDirectory() as tmp:
                      report=run_specialization(
                          name, Path(tmp), expected_guide_sha256=baseline)
                      from pathlib import Path
                      import json
                      packet=json.loads((Path(tmp)/"editorial-evidence-private.json").read_text(encoding="utf-8"))
                      assert packet["source_text_may_be_public"] is False
                      assert len(packet["payloads"])==report["guide_body_payloads"]
                      assert sum(len(x["tooltip_definitions"]) for x in packet["payloads"])==report["named_tooltip_definition_count"]
                      assert sum(len(x["conditional_expressions"]) for x in packet["payloads"])==report["conditional_display_count"]
                      scoped=json.loads((Path(tmp)/"scoped-audit.json").read_text(encoding="utf-8"))
                      assert scoped["source_text_in_report"] is False
                      assert (scoped["rows_in_ordered_lists"] +
                              scoped["rows_in_unordered_lists"]
                              <= scoped["source_row_candidates"])
                      assert scoped["rows_in_ordered_lists"] > 0
                      assert scoped["automatic_publish_allowed"] is False
                      assert scoped["guide_body_payload_count"]==report["guide_body_payloads"]
                      assert report["private_scoped_evidence_written"] is True
                      assert scoped["source_condition_expression_count"]==report["conditional_display_count"]
                      assert (
                          scoped["paired_conditional_scopes"]+
                          scoped["standalone_conditional_markers"]+
                          scoped["unassigned_conditional_expressions"]
                      )==scoped["source_condition_expression_count"]
                      print(label+"_private_editorial_packet_indexed=true")
                      print(label+"_scoped_row_candidates="+str(scoped["source_row_candidates"]))
                      print(label+"_ordered_list_row_candidates="+str(scoped["rows_in_ordered_lists"]))
                      print(label+"_unordered_list_row_candidates="+str(scoped["rows_in_unordered_lists"]))
                      print(label+"_rows_with_mixed_visibility="+str(scoped["rows_with_mixed_visibility"]))
                      print(label+"_standalone_conditional_markers="+str(scoped["standalone_conditional_markers"]))
                      print(label+"_unassigned_conditional_expressions="+str(scoped["unassigned_conditional_expressions"]))
                      print(label+"_paired_conditional_scopes="+str(scoped["paired_conditional_scopes"]))
                      print(label+"_standalone_marker_types="+str(scoped["standalone_conditional_marker_types"]))
                      print(label+"_scoped_structure_issues="+str(scoped["structure_issue_types"]))
                      print(label+"_scoped_issue_positions="+str(scoped["structure_issue_positions"]))
                      print(label+"_status=guide_identity_confirmed")
                      print(label+"_guide_body_count="+str(report["guide_body_payloads"]))
                      print(label+"_guide_body_characters="+str(report["guide_body_character_counts"][0]))
                      print(label+"_named_tooltips="+str(report["named_tooltip_definition_count"]))
                      print(label+"_choice_definitions="+str(report["option_definition_count"]))
                      print(label+"_modified_date="+str(report["observed_guide_update_date"]))
                      print(label+"_visible_patches="+",".join(report["visible_patch_candidates"]))
                      print(label+"_same_user_saved_body="+str(report["matches_known_baseline"]).lower())
                      print(label+"_current_patch_verified="+str(report["source_patch_verified"]).lower())
              except (SourceAccessError, SpecializationResolutionError) as exc:
                  msg=str(exc)
                  code=("forbidden_403" if "403" in msg else
                        "rate_limited_429" if "429" in msg else
                        "source_or_identity_unavailable")
                  print(label+"_status="+code)
                  print(label+"_current_patch_verified=false")
          PY

      - name: Check source-locked 12.1.5 gameplay decision cases without publishing HTML
        run: |
          PYTHONPATH=. python tests/live_enhancement_decision_review.py
