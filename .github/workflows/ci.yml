name: Validate and build (public bootstrap)

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual V2 validator dependencies
        run: python -m pip install -r requirements-v2.txt
      - name: Compile source
        run: python -m compileall -q engine tests
      - name: Verify synthetic source coverage never becomes publish-ready
        run: |
          python -m engine.source_coverage --input examples/synthetic-source-coverage.json --output dist/source-coverage-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("dist/source-coverage-audit.json").read_text(encoding="utf-8"))
          assert result["declared_coverage_candidate"] is False
          assert result["real_site_completeness_verified"] is False
          assert result["gameplay_meaning_verified"] is False
          assert result["automatic_publish_allowed"] is False
          assert result["source_text_in_report"] is False
          assert "unvisited_choice" in {g["type"] for g in result["gaps"]}
          PY
      - name: Verify synthetic static HTML and embedded WHML
        run: |
          python -m engine.source_structure --input examples/synthetic-source-structure.html --output dist/html-structure-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('dist/html-structure-audit.json').read_text(encoding='utf8'))
          assert len(report['hidden_region_candidates']) >= 3
          assert len(report['tooltip_trigger_candidates']) >= 1
          assert report['embedded_whml']['decoded_payloads'] == 1
          assert report['embedded_whml']['payloads'][0]['target'] == 'guide-body'
          assert report['source_text_in_report'] is False
          assert report['live_ui_completeness_verified'] is False
          assert report['automatic_publish_allowed'] is False
          PY
      - name: Reconcile synthetic HTML candidates with incomplete source capture
        run: |
          python -m engine.source_reconcile --structure dist/html-structure-audit.json --observations examples/synthetic-source-coverage.json --output dist/source-reconcile-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("dist/source-reconcile-audit.json").read_text(encoding="utf-8"))
          assert report["structure_candidate_count"] > 0
          assert report["unmapped_candidates"]
          assert report["declared_observation_gaps"]
          assert report["candidate_comparison_complete"] is False
          assert report["real_site_completeness_verified"] is False
          assert report["gameplay_meaning_verified"] is False
          assert report["source_text_in_report"] is False
          assert report["automatic_publish_allowed"] is False
          PY
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate synthetic fixture
        run: python -m engine validate --input examples/synthetic.json
      - name: Build demo HTML (not a real guide)
        run: python -m engine build --input examples/synthetic.json --output dist/index.html --allow-demo
      - name: Confirm the build is deterministic
        run: |
          cp dist/index.html /tmp/rotation-demo-first.html
          python -m engine build --input examples/synthetic.json --output dist/index.html --allow-demo
          cmp /tmp/rotation-demo-first.html dist/index.html
      - name: Validate public V11-derived rule metadata
        run: python -m engine.public_data validate
      - name: Build public rule index (not an actionable guide)
        run: python -m engine.public_data build --output dist/public-index.html
      - name: Confirm public index deterministic
        run: |
          cp dist/public-index.html /tmp/rotation-public-first.html
          python -m engine.public_data build --output dist/public-index.html
          cmp /tmp/rotation-public-first.html dist/public-index.html
      - name: Build dynamic review-only UI
        run: python -m engine.review_ui --output dist/review/index.html
      - name: Build standalone quick-reference manual
        run: python -m engine.manual_site --output dist/manual/index.html
      - name: Verify standalone manual deterministic
        run: |
          cp dist/manual/index.html /tmp/wow-manual-first.html
          python -m engine.manual_site --output dist/manual/index.html
          cmp /tmp/wow-manual-first.html dist/manual/index.html
      - name: Check manual browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("dist/manual/index.html").read_text(encoding="utf-8")
          script=page.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/wow-manual-app.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/wow-manual-app.js
      - name: Generate fail-closed source/locale readiness report
        run: python -m engine.review_audit --output dist/review-audit.json
      - name: Confirm dynamic review HTML deterministic
        run: |
          cp dist/review/index.html /tmp/wow-review-first.html
          python -m engine.review_ui --output dist/review/index.html
          cmp /tmp/wow-review-first.html dist/review/index.html
      - name: Assert unverified content cannot pass publication gate
        run: |
          if python -m engine.review_audit --require-publish-ready --output dist/review-audit.json; then
            echo "ERROR: Unverified rules passed readiness gate"
            exit 1
          fi
      - name: Audit inherited Korean spell names (no network, no approval)
        run: python -m engine.spell_names audit --output dist/spell-name-audit.json
      - name: Ensure name audit cannot auto-approve or publish
        run: |
          python - <<'PY'
          import json
          d=json.load(open("dist/spell-name-audit.json", encoding="utf-8"))
          assert d["publish_ready"] is False
          assert d["counts"]["distinct_spell_ids"] == 176
          assert d["counts"]["not_checked"] == 176
          assert d["counts"]["official_names_auto_approved"] == 0
          PY
      - name: Validate and export all 177 condition review states
        run: python -m engine.condition_worklist --output dist/condition-worklist.json
      - name: Assert no partial condition auto-publishes
        run: |
          python - <<'PY'
          import json
          r=json.load(open("dist/condition-worklist.json",encoding="utf-8"))
          assert r["summary"]["total_rows"] == 177
          assert r["summary"]["partial_candidate_pending"] == 2
          assert r["summary"]["not_formalized"] == 175
          assert r["summary"]["approved_full_conditions"] == 0
          assert r["summary"]["publish_ready"] is False
          assert all(not x["can_execute_rotation"] and
                     not x["automatic_publish_allowed"] for x in r["entries"])
          PY
      - name: Verify unapproved condition gate refuses readiness
        run: |
          if python -m engine.condition_worklist --require-ready --output dist/condition-worklist.json; then
            echo "ERROR: Partial condition proposals bypassed review gate"
            exit 1
          fi
      - name: Capture synthetic source-text hashes without publishing text
        run: |
          python -m engine.source_snapshots capture --input examples/synthetic-source-before.json --output dist/synthetic-source-before.json
          python -m engine.source_snapshots capture --input examples/synthetic-source-after.json --output dist/synthetic-source-after.json
      - name: Compare synthetic snapshots, flag source-driven review
        run: |
          python -m engine.source_snapshots diff --previous dist/synthetic-source-before.json --current dist/synthetic-source-after.json --output dist/synthetic-source-diff.json
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("dist/synthetic-source-before.json").read_text(encoding="utf8"))
          after=json.loads(Path("dist/synthetic-source-after.json").read_text(encoding="utf8"))
          diff=json.loads(Path("dist/synthetic-source-diff.json").read_text(encoding="utf8"))
          assert diff["affected_count"] == 1
          assert diff["requires_human_review"] is True
          assert diff["automatic_publish_allowed"] is False
          assert diff["source_meaning_verified"] is False
          assert before["source_text_in_snapshot"] is False
          assert after["source_text_in_snapshot"] is False
          assert "SYNTHETIC DATA ONLY" not in json.dumps(before)
          assert "SYNTHETIC DATA ONLY" not in json.dumps(after)
          assert "SYNTHETIC DATA ONLY" not in json.dumps(diff)
          PY
      - name: Generate fail-closed official spell review queue
        run: python -m engine.spell_triage --output dist/spell-review-queue.json
      - name: Verify 404 priority and name mismatch audit counts
        run: |
          python - <<'PY'
          import json
          p="dist/spell-review-queue.json"
          q=json.load(open(p, encoding="utf-8"))
          s=q["summary"]
          assert s["unique_spell_ids"] == 176 and s["raw_name_records"] == 178
          assert s["api_name_matches"] == 150 and s["api_name_mismatches"] == 1
          assert s["api_404"] == 25 and s["review_queue_ids"] == 26
          assert s["priority_rotation_spell_ids"] == 1
          assert s["affected_priority_rows"] == 4
          assert s["glossary_only_review_ids"] == 25
          assert not q["automatic_publish_allowed"]
          assert all(not x["automatic_name_correction_allowed"]
                     for x in q["records"])
          PY
      - name: Ensure unresolved official lookup does not pass gate
        run: |
          if python -m engine.spell_triage --output dist/spell-review-queue.json --require-resolved; then
            echo "ERROR: Unverified Blizzard spell IDs passed readiness gate"
            exit 1
          fi
      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wow-engine-data-review-html
          path: |
            dist/index.html
            dist/public-index.html
            dist/review/index.html
            dist/manual/index.html
            dist/review-audit.json
            dist/spell-name-audit.json
            dist/condition-worklist.json
            dist/synthetic-source-diff.json
            dist/spell-review-queue.json
          retention-days: 7
      - name: Upload reader-friendly HTML (single file)
        uses: actions/upload-artifact@v4
        with:
          name: wow-rotation-quick-reference-html
          path: dist/manual/index.html
          retention-days: 14
