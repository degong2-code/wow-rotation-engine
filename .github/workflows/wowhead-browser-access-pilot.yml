name: Wowhead browser access pilot (metadata only)
on:
  push:
    branches: ['work/**']
    paths:
      - '.github/workflows/wowhead-browser-access-pilot.yml'
      - 'scripts/wowhead-browser-access-pilot.mjs'
permissions:
  contents: read
jobs:
  verify-ui-access:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Probe one public Wowhead guide in real Chromium (no original text output)
        run: node scripts/wowhead-browser-access-pilot.mjs
